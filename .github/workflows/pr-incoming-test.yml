name: Incoming PR to Test
run-name: PR to test opened by ${{ github.actor }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [test]

permissions:
  contents: read
  id-token: write

jobs:
  slim-ci-test-dbt-job:
    name: "Slim CI on Incoming PR to Test"
    runs-on: ubuntu-latest
    environment: test
    env:
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_ROLE: ${{ vars.SNOWFLAKE_ROLE }}
      SNOWFLAKE_WAREHOUSE: ${{ vars.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}
      TARGET_ENV: test
      PROJECT_SCHEMA: PROJECT_TEST
      PROJECT_OBJECT: tasty_bytes_dbt_project_object_test
      TESTER_PROJECT_OBJECT: tester_tasty_bytes_gh_action_test

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with:
          use-oidc: true

      - name: Check Snowflake CLI Version
        run: snow --version

      - name: Test connection
        run: snow connection test -x

      - name: Generate env.yml for test
        run: envsubst < ./tasty_bytes/env.yml.template > ./tasty_bytes/env.yml

      - name: Deploy tester dbt project object (no auto-compile)
        run: |
          snow dbt deploy "${{ env.TESTER_PROJECT_OBJECT }}" \
            --database "${{ vars.SNOWFLAKE_DATABASE }}" \
            --schema "${{ env.PROJECT_SCHEMA }}" \
            --source ./tasty_bytes \
            --no-auto-compile \
            --dbt-version 1.11.11 \
            --force -x

      - name: Get last successful prod run artifacts
        id: get_state
        run: |
          QUERY_ID=$(snow sql -x --format json -q \
            "SELECT SYSTEM\$DBT_GET_LAST_SUCCESSFUL_RUN_TARGET('${{ vars.SNOWFLAKE_DATABASE }}.${{ env.PROJECT_SCHEMA }}.${{ env.PROJECT_OBJECT }}') AS query_id;" \
            | jq -r '.[0].query_id')

          if [ -z "$QUERY_ID" ] || [ "$QUERY_ID" == "null" ]; then
            echo "No successful prod run found in the last 7 days — falling back to full build."
            echo "has_baseline=false" >> "$GITHUB_OUTPUT"
          else
            echo "Found prod baseline query id: $QUERY_ID"
            echo "query_id=$QUERY_ID" >> "$GITHUB_OUTPUT"
            echo "has_baseline=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Slim CI build — changed models only
        if: steps.get_state.outputs.has_baseline == 'true'
        run: |
          snow sql -x -q "
          EXECUTE DBT PROJECT ${{ vars.SNOWFLAKE_DATABASE }}.${{ env.PROJECT_SCHEMA }}.${{ env.TESTER_PROJECT_OBJECT }}
            ARGS = 'build --state ./imports/state --defer --select state:modified+ --target test'
            IMPORTS = (
              SYSTEM\$LOCATE_DBT_ARTIFACTS('${{ steps.get_state.outputs.query_id }}') AS 'state'
            );
          "

      - name: Fallback — full build (no prod baseline available)
        if: steps.get_state.outputs.has_baseline == 'false'
        run: snow dbt execute -x "${{ env.TESTER_PROJECT_OBJECT }}" build --target test